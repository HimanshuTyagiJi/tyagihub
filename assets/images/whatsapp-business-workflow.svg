<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="waBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="waCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="waFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="waShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="url(#waBg)" stroke="#065f46" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">
    WhatsApp Business Solopreneur Communication Pipeline
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    How Automated Greetings, Quick Replies, and Chat Labels create a lightweight client CRM on your phone
  </text>

  <!-- Step 1: Customer Inbound &amp; Automated Greeting -->
  <g transform="translate(35, 110)" filter="url(#waShadow)">
    <rect width="250" height="310" rx="10" fill="url(#waCard)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#10b981" opacity="0.25"/>
    <rect y="25" width="250" height="15" fill="#10b981" opacity="0.25"/>
    <text x="18" y="26" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">💬 1. Instant Response</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">INBOUND CLIENT INQUIRY:</text>

      <rect y="25" width="218" height="52" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="44" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Automated Greeting Message</text>
      <text x="10" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Sends instant welcome + brochure link within 1 sec.</text>

      <text x="0" y="98" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Scheduled Away Message:</text>
      <rect y="108" width="218" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="126" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Outside Business Hours</text>
      <text x="10" y="144" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">"We are offline. We will reply tomorrow at 9 AM."</text>

      <text x="0" y="184" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Never leaves a prospect waiting on "Read".</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(295, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#waFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#34d399"/>
  </g>

  <!-- Step 2: Quick Reply Shortcuts -->
  <g transform="translate(335, 110)" filter="url(#waShadow)">
    <rect width="250" height="310" rx="10" fill="url(#waCard)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#0284c7" opacity="0.25"/>
    <rect y="25" width="250" height="15" fill="#0284c7" opacity="0.25"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">⚡ 2. Quick Reply Shortcuts</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">TYPE "/" SHORTCUTS:</text>

      <rect y="25" width="218" height="34" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <text x="10" y="44" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">/pricing → Service Rate Card</text>

      <rect y="66" width="218" height="34" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <text x="10" y="85" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">/upi → Business Bank/UPI QR</text>

      <rect y="107" width="218" height="34" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <text x="10" y="126" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">/call → Calendly Meeting Link</text>

      <text x="0" y="165" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Free Product Catalog:</text>
      <text x="0" y="184" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Clients can browse services with prices directly inside the chat window.</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(595, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#waFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#a78bfa"/>
  </g>

  <!-- Step 3: Color-Coded Chat Labels (Mini CRM) -->
  <g transform="translate(635, 110)" filter="url(#waShadow)">
    <rect width="230" height="310" rx="10" fill="url(#waCard)" stroke="#a78bfa" stroke-width="1.5"/>
    <rect width="230" height="40" rx="10" fill="#7c3aed" opacity="0.25"/>
    <rect y="25" width="230" height="15" fill="#7c3aed" opacity="0.25"/>
    <text x="18" y="26" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">🏷️ 3. Chat Labels CRM</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">CLIENT PIPELINE STAGES:</text>

      <rect y="25" width="198" height="28" rx="5" fill="#0284c7" opacity="0.25"/>
      <text x="10" y="44" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">🔵 New Prospect / Lead</text>

      <rect y="60" width="198" height="28" rx="5" fill="#f59e0b" opacity="0.25"/>
      <text x="10" y="79" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">🟡 Active Project / In Progress</text>

      <rect y="95" width="198" height="28" rx="5" fill="#ef4444" opacity="0.25"/>
      <text x="10" y="114" fill="#f87171" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">🔴 Payment Pending / Invoiced</text>

      <rect y="130" width="198" height="28" rx="5" fill="#10b981" opacity="0.25"/>
      <text x="10" y="149" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">🟢 Completed / Retainer</text>

      <text x="0" y="184" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Filter any label in 1 click to view all relevant clients at once.</text>
    </g>
  </g>
</svg>
