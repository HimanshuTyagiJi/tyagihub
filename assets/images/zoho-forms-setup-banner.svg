<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad2)"/>

  <!-- Decorative Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 100)">
    <!-- Pill Badge -->
    <rect width="210" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#10b981"/>
    <text x="38" y="24" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">DIGITAL TOOLS GUIDE</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="850" letter-spacing="-1">
      Embed Free Custom Forms
    </text>
    <text x="0" y="145" fill="url(#accentGrad2)" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800">
      Using Zoho Forms (No-Code)
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">
      Lead Generation, Contact Inquiries &amp; Feedback Forms
    </text>
    <text x="0" y="232" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      100% Free Forever • Instant Email Alerts • Zero Coding
    </text>

    <!-- Checklist -->
    <g transform="translate(0, 280)">
      <circle cx="12" cy="12" r="10" fill="#10b981" opacity="0.2"/>
      <path d="M7 12l3 3 7-7" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <text x="32" y="18" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Replaces Ugly Google Forms &amp; Paid Typeform</text>

      <circle cx="12" cy="52" r="10" fill="#10b981" opacity="0.2"/>
      <path d="M7 52l3 3 7-7" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <text x="32" y="58" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Built-In Spam Protection &amp; File Uploads</text>

      <circle cx="12" cy="92" r="10" fill="#10b981" opacity="0.2"/>
      <path d="M7 92l3 3 7-7" stroke="#10b981" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <text x="32" y="98" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Copy-Paste Embed for WordPress, HTML &amp; React</text>
    </g>
  </g>

  <!-- Right Mockup: Form UI Preview -->
  <g transform="translate(710, 80)" filter="url(#shadow2)">
    <rect width="420" height="470" rx="16" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Top Header -->
    <rect width="420" height="42" rx="16" fill="#1e293b"/>
    <rect y="26" width="420" height="16" fill="#1e293b"/>
    <circle cx="22" cy="21" r="5.5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5.5" fill="#f59e0b"/>
    <circle cx="58" cy="21" r="5.5" fill="#10b981"/>
    <text x="85" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">🌐 Website Embedded Contact Form</text>

    <!-- Form Content Area -->
    <g transform="translate(30, 60)">
      <text x="0" y="20" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="800">Send an Inquiry</text>
      <text x="0" y="38" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">We typically reply within 24 business hours.</text>

      <!-- Field 1: Name -->
      <g transform="translate(0, 55)">
        <text x="0" y="10" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Full Name *</text>
        <rect y="16" width="360" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Himanshu Tyagi</text>
      </g>

      <!-- Field 2: Work Email -->
      <g transform="translate(0, 115)">
        <text x="0" y="10" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Email Address *</text>
        <rect y="16" width="360" height="34" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="12" y="38" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">himanshu@tyagihub.in</text>
      </g>

      <!-- Field 3: Service Selection -->
      <g transform="translate(0, 175)">
        <text x="0" y="10" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Project Type *</text>
        <rect y="16" width="360" height="34" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.2"/>
        <text x="12" y="38" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11">Custom SaaS / Web Workflow Setup</text>
        <text x="340" y="38" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="12">▼</text>
      </g>

      <!-- Field 4: Message -->
      <g transform="translate(0, 235)">
        <text x="0" y="10" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Your Message *</text>
        <rect y="16" width="360" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
        <text x="12" y="36" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11">Describe what you need help configuring...</text>
      </g>

      <!-- Submit Button -->
      <g transform="translate(0, 325)">
        <rect width="360" height="42" rx="8" fill="#0284c7"/>
        <text x="180" y="26" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Submit Message →</text>
      </g>

      <!-- Security Trust Line -->
      <text x="180" y="390" text-anchor="middle" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">
        🔒 256-Bit SSL Encrypted • Zoho Anti-Spam Protected
      </text>
    </g>
  </g>
</svg>
