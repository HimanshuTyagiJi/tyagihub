<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="obBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="obGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="obFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="obShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="url(#obBg)" stroke="#312e81" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">
    The Obsidian Offline Second Brain Architecture
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    How 100% local plain-text Markdown files connect via Bidirectional [[Wikilinks]] into an intelligent knowledge graph
  </text>

  <!-- Box 1: Local Vault Folder -->
  <g transform="translate(40, 110)" filter="url(#obShadow)">
    <rect width="240" height="310" rx="10" fill="url(#obGrad1)" stroke="#a855f7" stroke-width="1.5"/>
    <rect width="240" height="40" rx="10" fill="#a855f7" opacity="0.25"/>
    <rect y="25" width="240" height="15" fill="#a855f7" opacity="0.25"/>
    <text x="18" y="26" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="750">📁 1. Local Vault (.md)</text>

    <g transform="translate(18, 55)">
      <text x="0" y="15" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">PLAIN-TEXT STORAGE:</text>

      <circle cx="5" cy="38" r="3.5" fill="#a855f7"/>
      <text x="16" y="42" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">100% Offline Files</text>
      <text x="16" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Saved on your hard drive / SSD.</text>

      <circle cx="5" cy="84" r="3.5" fill="#a855f7"/>
      <text x="16" y="88" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Zero Proprietary Locks</text>
      <text x="16" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Readable by any text editor forever.</text>

      <circle cx="5" cy="130" r="3.5" fill="#a855f7"/>
      <text x="16" y="134" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Zero Monthly Subscription</text>
      <text x="16" y="150" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">No $10/mo cloud lock-in.</text>

      <rect x="0" y="172" width="204" height="60" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="10" y="194" fill="#c084fc" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">⚡ True Data Ownership:</text>
      <text x="10" y="214" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">If Obsidian closes, your notes survive intact.</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(290, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#obFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#c084fc"/>
  </g>

  <!-- Box 2: Linking Engine -->
  <g transform="translate(330, 110)" filter="url(#obShadow)">
    <rect width="240" height="310" rx="10" fill="url(#obGrad1)" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="240" height="40" rx="10" fill="#6366f1" opacity="0.25"/>
    <rect y="25" width="240" height="15" fill="#6366f1" opacity="0.25"/>
    <text x="18" y="26" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="750">🔗 2. [[Wikilinks]] Core</text>

    <g transform="translate(18, 55)">
      <text x="0" y="15" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">HOW IDEAS CONNECT:</text>

      <circle cx="5" cy="38" r="3.5" fill="#818cf8"/>
      <text x="16" y="42" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Type [[Idea Name]]</text>
      <text x="16" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Instantly links notes bidirectionally.</text>

      <circle cx="5" cy="84" r="3.5" fill="#818cf8"/>
      <text x="16" y="88" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Automatic Backlinks</text>
      <text x="16" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Shows every note that mentions this idea.</text>

      <circle cx="5" cy="130" r="3.5" fill="#818cf8"/>
      <text x="16" y="134" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Daily Journal Anchor</text>
      <text x="16" y="150" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Every meeting or thought logged with date.</text>

      <rect x="0" y="172" width="204" height="60" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="10" y="194" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">🧠 Bottom-Up Thinking:</text>
      <text x="10" y="214" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">No rigid folders needed. Structure emerges.</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(580, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#obFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#38bdf8"/>
  </g>

  <!-- Box 3: Graph View &amp; Knowledge Discovery -->
  <g transform="translate(620, 110)" filter="url(#obShadow)">
    <rect width="240" height="310" rx="10" fill="url(#obGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="240" height="40" rx="10" fill="#0284c7" opacity="0.25"/>
    <rect y="25" width="240" height="15" fill="#0284c7" opacity="0.25"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="750">🌐 3. Interactive Graph View</text>

    <g transform="translate(18, 55)">
      <text x="0" y="15" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">VISUAL SYNTHESIS:</text>

      <circle cx="5" cy="38" r="3.5" fill="#38bdf8"/>
      <text x="16" y="42" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Visual Constellation</text>
      <text x="16" y="58" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Watch ideas cluster into topic hubs.</text>

      <circle cx="5" cy="84" r="3.5" fill="#38bdf8"/>
      <text x="16" y="88" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Instant Spotting of Gaps</text>
      <text x="16" y="104" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Find orphaned thoughts that need links.</text>

      <circle cx="5" cy="130" r="3.5" fill="#38bdf8"/>
      <text x="16" y="134" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Free Sync Options</text>
      <text x="16" y="150" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Sync via Git, Syncthing, or iCloud for ₹0.</text>

      <rect x="0" y="172" width="204" height="60" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="10" y="194" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">⚡ Result:</text>
      <text x="10" y="214" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">A personal Wikipedia that grows smarter over time.</text>
    </g>
  </g>
</svg>
