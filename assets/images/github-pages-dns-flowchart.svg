<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="ghBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="ghCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="ghFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="ghShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="url(#ghBg)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">
    GitHub Pages Custom Domain &amp; Free SSL Architecture
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    How DNS Zone Records route requests to GitHub Edge Servers with automated Let's Encrypt HTTPS
  </text>

  <!-- Step 1: Registrar DNS Zone -->
  <g transform="translate(35, 110)" filter="url(#ghShadow)">
    <rect width="250" height="310" rx="10" fill="url(#ghCard)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#0284c7" opacity="0.25"/>
    <rect y="25" width="250" height="15" fill="#0284c7" opacity="0.25"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">🌐 1. Domain DNS Records</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">GODADDY / NAMECHEAP:</text>

      <rect y="25" width="218" height="88" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="44" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">A @ 185.199.108.153</text>
      <text x="10" y="60" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">A @ 185.199.109.153</text>
      <text x="10" y="76" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">A @ 185.199.110.153</text>
      <text x="10" y="92" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">A @ 185.199.111.153</text>

      <text x="0" y="132" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">WWW Subdomain Alias:</text>
      <rect y="142" width="218" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="162" fill="#a78bfa" font-family="monospace" font-size="10" font-weight="700">CNAME www → user.github.io</text>

      <text x="0" y="194" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Points apex (@) &amp; www to GitHub globally.</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(295, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#ghFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#818cf8"/>
  </g>

  <!-- Step 2: GitHub Repository &amp; CNAME -->
  <g transform="translate(335, 110)" filter="url(#ghShadow)">
    <rect width="250" height="310" rx="10" fill="url(#ghCard)" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#6366f1" opacity="0.25"/>
    <rect y="25" width="250" height="15" fill="#6366f1" opacity="0.25"/>
    <text x="18" y="26" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">📦 2. GitHub Repo &amp; CNAME</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">REPOSITORY ROOT FILE:</text>

      <rect y="25" width="218" height="45" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1"/>
      <text x="10" y="44" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">File: CNAME</text>
      <text x="10" y="60" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="700">tyagihub.in</text>

      <text x="0" y="92" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Repo Settings → Pages:</text>
      <rect y="102" width="218" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="122" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Source: Deploy from branch</text>
      <text x="10" y="138" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Branch: main / (root)</text>
      <text x="10" y="154" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Custom domain: tyagihub.in</text>

      <text x="0" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Locks repository to your exact domain name.</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(595, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#ghFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#10b981"/>
  </g>

  <!-- Step 3: Global Edge CDN &amp; Enforce HTTPS -->
  <g transform="translate(635, 110)" filter="url(#ghShadow)">
    <rect width="230" height="310" rx="10" fill="url(#ghCard)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="230" height="40" rx="10" fill="#10b981" opacity="0.25"/>
    <rect y="25" width="230" height="15" fill="#10b981" opacity="0.25"/>
    <text x="18" y="26" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">🔒 3. Free SSL &amp; Global CDN</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">SECURITY &amp; SPEED:</text>

      <rect y="25" width="198" height="50" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="44" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">✓ Enforce HTTPS: ON</text>
      <text x="10" y="62" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Auto-renewing Let's Encrypt cert</text>

      <text x="0" y="98" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Hosting Benefits:</text>
      <text x="0" y="118" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">• 100% Free Forever</text>
      <text x="0" y="136" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">• Zero server crashes</text>
      <text x="0" y="154" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">• 99.99% Uptime SLA</text>
      <text x="0" y="172" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">• AdSense Bot 100% friendly</text>
    </g>
  </g>
</svg>
