<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="airtableBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="50%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="yellowAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glowAir" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#airtableBg)"/>

  <!-- Subtle Grid Lines -->
  <g stroke="#27272a" stroke-width="1" opacity="0.4">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <circle cx="200" cy="180" r="180" fill="#f59e0b" opacity="0.12" filter="url(#glowAir)"/>
  <circle cx="1020" cy="420" r="220" fill="#3b82f6" opacity="0.12" filter="url(#glowAir)"/>

  <!-- Badge -->
  <rect x="80" y="80" width="220" height="42" rx="21" fill="rgba(245, 158, 11, 0.15)" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="105" cy="101" r="6" fill="#f59e0b"/>
  <text x="125" y="107" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1">PRODUCTIVITY</text>

  <!-- Title -->
  <text x="80" y="180" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="48" font-weight="850" letter-spacing="-1">
    Airtable for Beginners
  </text>
  <text x="80" y="240" fill="url(#yellowAccent)" font-family="system-ui, sans-serif" font-size="44" font-weight="800">
    Free Custom Client Tracker
  </text>

  <!-- Subtitle -->
  <text x="80" y="300" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22" font-weight="500">
    How I ditched messy spreadsheets for a visual relational database
  </text>

  <!-- 3 Feature Chips -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="18" y="25" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="15" font-weight="600">📊 Relational Links</text>

    <rect x="195" y="0" width="180" height="40" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="213" y="25" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">📌 Kanban Board</text>

    <rect x="390" y="0" width="185" height="40" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
    <text x="408" y="25" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="15" font-weight="600">⚡ 1,000 Free Records</text>
  </g>

  <!-- Publisher Tag -->
  <text x="80" y="550" fill="#71717a" font-family="system-ui, sans-serif" font-size="18" font-weight="600">
    TyagiHub Research • Tested &amp; Verified Guide
  </text>

  <!-- Right Visual: Kanban &amp; Relational Cards -->
  <g transform="translate(730, 100)">
    <!-- Main Airtable Card Background -->
    <rect x="0" y="0" width="380" height="420" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="2" filter="url(#glowAir)"/>
    
    <!-- Top Airtable Header Mock -->
    <rect x="0" y="0" width="380" height="45" rx="16" fill="#27272a"/>
    <circle cx="25" cy="22" r="6" fill="#f59e0b"/>
    <text x="42" y="27" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Client CRM &amp; Projects Base</text>

    <!-- Column 1: Leads -->
    <g transform="translate(18, 60)">
      <rect width="165" height="330" rx="10" fill="#09090b" stroke="#27272a"/>
      <rect x="12" y="12" width="60" height="18" rx="4" fill="#3b82f6"/>
      <text x="18" y="25" fill="#fff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">LEADS (2)</text>

      <!-- Card 1 -->
      <rect x="10" y="42" width="145" height="85" rx="8" fill="#18181b" stroke="#3f3f46"/>
      <text x="20" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Sharmaji Bakery</text>
      <text x="20" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Web Redesign</text>
      <rect x="20" y="95" width="55" height="18" rx="4" fill="#064e3b"/>
      <text x="26" y="108" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">₹25,000</text>

      <!-- Card 2 -->
      <rect x="10" y="140" width="145" height="85" rx="8" fill="#18181b" stroke="#3f3f46"/>
      <text x="20" y="163" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Apex Logistics</text>
      <text x="20" y="180" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">SEO Audit</text>
      <rect x="20" y="193" width="55" height="18" rx="4" fill="#064e3b"/>
      <text x="26" y="206" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">₹15,000</text>
    </g>

    <!-- Column 2: In Progress -->
    <g transform="translate(195, 60)">
      <rect width="165" height="330" rx="10" fill="#09090b" stroke="#27272a"/>
      <rect x="12" y="12" width="90" height="18" rx="4" fill="#10b981"/>
      <text x="18" y="25" fill="#fff" font-family="system-ui, sans-serif" font-size="10" font-weight="800">ACTIVE (1)</text>

      <!-- Card 3 -->
      <rect x="10" y="42" width="145" height="100" rx="8" fill="#18181b" stroke="#10b981" stroke-width="1.5"/>
      <text x="20" y="65" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Tyagi Solutions</text>
      <text x="20" y="82" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Cloud Architecture</text>
      <rect x="20" y="95" width="60" height="18" rx="4" fill="#064e3b"/>
      <text x="26" y="108" fill="#34d399" font-family="system-ui, sans-serif" font-size="9" font-weight="700">₹45,000</text>
      <!-- Progress Bar -->
      <rect x="20" y="125" width="125" height="6" rx="3" fill="#27272a"/>
      <rect x="20" y="125" width="95" height="6" rx="3" fill="#10b981"/>
    </g>
  </g>
</svg>
