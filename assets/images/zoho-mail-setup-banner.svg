<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="zohoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="blueAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glowZoho" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#zohoBg)"/>

  <!-- Subtle Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glowing background elements -->
  <circle cx="250" cy="180" r="190" fill="#0284c7" opacity="0.12" filter="url(#glowZoho)"/>
  <circle cx="980" cy="420" r="210" fill="#ef4444" opacity="0.10" filter="url(#glowZoho)"/>

  <!-- Top Badge -->
  <rect x="80" y="80" width="260" height="42" rx="21" fill="rgba(2, 132, 199, 0.15)" stroke="#38bdf8" stroke-width="1.5"/>
  <circle cx="105" cy="101" r="6" fill="#38bdf8"/>
  <text x="125" y="107" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1">CLOUD APPS &amp; TOOLS</text>

  <!-- Headline -->
  <text x="80" y="180" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="48" font-weight="850" letter-spacing="-1">
    Zoho Mail Custom Domain
  </text>
  <text x="80" y="240" fill="url(#blueAccent)" font-family="system-ui, sans-serif" font-size="44" font-weight="800">
    100% Free Business Email Setup
  </text>

  <!-- Subtitle -->
  <text x="80" y="300" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22" font-weight="500">
    Complete DNS configuration: MX, SPF &amp; DKIM records without Google fees
  </text>

  <!-- 3 Feature Chips -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="18" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">✉️ 5 Free Inboxes</text>

    <rect x="195" y="0" width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="213" y="25" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">⚡ Instant DNS Setup</text>

    <rect x="390" y="0" width="185" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="408" y="25" fill="#22c55e" font-family="system-ui, sans-serif" font-size="15" font-weight="600">🔒 100% Spam Shield</text>
  </g>

  <!-- Publisher Tag -->
  <text x="80" y="550" fill="#64748b" font-family="system-ui, sans-serif" font-size="18" font-weight="600">
    TyagiHub Research • Verified 2026 Tutorial
  </text>

  <!-- Right Visual Graphic: Email &amp; DNS Cards -->
  <g transform="translate(740, 130)">
    <!-- Main Email Envelope Card -->
    <rect x="0" y="0" width="360" height="230" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glowZoho)"/>
    
    <!-- Email Header -->
    <rect x="0" y="0" width="360" height="50" rx="16" fill="#0f172a"/>
    <circle cx="30" cy="25" r="5" fill="#ef4444"/>
    <circle cx="45" cy="25" r="5" fill="#f59e0b"/>
    <circle cx="60" cy="25" r="5" fill="#10b981"/>
    <text x="90" y="30" fill="#94a3b8" font-family="monospace" font-size="13">you@yourdomain.com</text>

    <!-- Email body lines -->
    <rect x="30" y="75" width="200" height="12" rx="4" fill="#38bdf8" opacity="0.8"/>
    <rect x="30" y="105" width="300" height="8" rx="4" fill="#334155"/>
    <rect x="30" y="125" width="280" height="8" rx="4" fill="#334155"/>
    <rect x="30" y="145" width="240" height="8" rx="4" fill="#334155"/>
    <rect x="30" y="175" width="100" height="28" rx="6" fill="#0284c7"/>
    <text x="55" y="194" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">SEND</text>

    <!-- Floating DNS Record Badge -->
    <g transform="translate(40, 200)">
      <rect x="0" y="0" width="320" height="120" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5" filter="url(#glowZoho)"/>
      <text x="20" y="35" fill="#34d399" font-family="system-ui, sans-serif" font-size="14" font-weight="800">✅ DNS RECORDS VERIFIED</text>
      <text x="20" y="65" fill="#f8fafc" font-family="monospace" font-size="12">MX: mx.zoho.in (Pri: 10)</text>
      <text x="20" y="85" fill="#f8fafc" font-family="monospace" font-size="12">SPF: v=spf1 include:zoho.in ~all</text>
      <text x="20" y="105" fill="#f8fafc" font-family="monospace" font-size="12">DKIM: zmail._domainkey (Active)</text>
    </g>
  </g>
</svg>
