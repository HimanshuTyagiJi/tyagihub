<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="anaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1b18"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#130e0c"/>
    </linearGradient>
    <linearGradient id="anaCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
    <linearGradient id="anaFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="anaShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="url(#anaBg)" stroke="#78350f" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">
    The 3-Tier Analog Daily Focus System
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#fde68a" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    How physical index cards, tactile pen logging, and shutdown rituals eliminate digital screen fatigue
  </text>

  <!-- Step 1: Morning 3-Task Card -->
  <g transform="translate(35, 110)" filter="url(#anaShadow)">
    <rect width="250" height="310" rx="10" fill="url(#anaCard)" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#f59e0b" opacity="0.2"/>
    <rect y="25" width="250" height="15" fill="#f59e0b" opacity="0.2"/>
    <text x="18" y="26" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">🌅 1. Morning 3-Task Card</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">WRITTEN BEFORE SCREENS:</text>

      <rect y="25" width="218" height="60" rx="6" fill="#09090b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="44" fill="#fde68a" font-family="monospace" font-size="10" font-weight="700">Physical 3x5 Index Card</text>
      <text x="10" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Maximum 3 primary priorities only</text>
      <text x="10" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Zero endless 50-task digital lists!</text>

      <text x="0" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Cognitive Benefit:</text>
      <rect y="115" width="218" height="52" rx="6" fill="#09090b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="134" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700">Forces Ruthless Ruthlessness</text>
      <text x="10" y="152" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Protects against reactive email loops</text>

      <text x="0" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Prop card next to keyboard as anchor.</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(295, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#anaFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#f59e0b"/>
  </g>

  <!-- Step 2: 90-Min Sprints & Distraction Pad -->
  <g transform="translate(335, 110)" filter="url(#anaShadow)">
    <rect width="250" height="310" rx="10" fill="url(#anaCard)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#0284c7" opacity="0.2"/>
    <rect y="25" width="250" height="15" fill="#0284c7" opacity="0.2"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">⚡ 2. The Distraction Pad</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">TACTILE CATCH-BASIN:</text>

      <rect y="25" width="218" height="60" rx="6" fill="#09090b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="44" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Open Notebook beside Workspace</text>
      <text x="10" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Random impulses jotted down in 2 sec</text>
      <text x="10" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">"Check flight tickets" / "Look up shoes"</text>

      <text x="0" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Preserves Focus Flow:</text>
      <rect y="115" width="218" height="52" rx="6" fill="#09090b" stroke="#334155" stroke-width="1"/>
      <text x="10" y="134" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700">Zero Browser Tab Opening</text>
      <text x="10" y="152" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Brain is satisfied that thought is recorded</text>

      <text x="0" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Deep work sprint continues uninterrupted.</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(595, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#anaFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#10b981"/>
  </g>

  <!-- Step 3: Evening Shutdown Ritual -->
  <g transform="translate(635, 110)" filter="url(#anaShadow)">
    <rect width="230" height="310" rx="10" fill="url(#anaCard)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="230" height="40" rx="10" fill="#059669" opacity="0.2"/>
    <rect y="25" width="230" height="15" fill="#059669" opacity="0.2"/>
    <text x="18" y="26" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">🌙 3. Physical Shutdown</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">CLOSING THE DAY:</text>

      <rect y="25" width="198" height="60" rx="6" fill="#09090b" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="44" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Strike Through in Ink</text>
      <text x="10" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Cross out completed tasks</text>
      <text x="10" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Migrate leftovers to tomorrow</text>

      <text x="0" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Psychological Release:</text>
      <rect y="115" width="198" height="52" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="135" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">✓ Close the Notebook Cover</text>
      <text x="10" y="153" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="9">Signals brain: Work is DONE.</text>

      <text x="0" y="190" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Zero evening anxiety or insomnia.</text>
    </g>
  </g>
</svg>