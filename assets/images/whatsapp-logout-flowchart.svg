<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" width="1000" height="360">
  <defs>
    <linearGradient id="stepBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="1000" height="360" rx="16" fill="#0b1120" stroke="#1e293b" stroke-width="2"/>

  <!-- Title Bar -->
  <text x="40" y="45" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1">QUICK ACTION WORKFLOW</text>
  <text x="40" y="78" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="22" font-weight="800">4-Step Remote Device Revocation Process</text>

  <!-- Flowchart Steps Grid -->
  <g transform="translate(40, 110)">
    
    <!-- STEP 1 -->
    <g transform="translate(0, 0)">
      <rect width="205" height="190" rx="12" fill="url(#stepBg)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
      <!-- Step Badge -->
      <circle cx="36" cy="36" r="16" fill="#005b99"/>
      <text x="31" y="42" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">1</text>
      <text x="64" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="750">Open Menu</text>
      
      <!-- Visual Graphic -->
      <rect x="25" y="70" width="155" height="50" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="40" y="100" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Chats Tab</text>
      <circle cx="160" cy="85" r="3" fill="#38bdf8"/>
      <circle cx="160" cy="95" r="3" fill="#38bdf8"/>
      <circle cx="160" cy="105" r="3" fill="#38bdf8"/>

      <text x="25" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Tap three vertical</text>
      <text x="25" y="168" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">dots (⋮) in top right</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M218 95 L232 95 M226 89 L232 95 L226 101" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- STEP 2 -->
    <g transform="translate(245, 0)">
      <rect width="205" height="190" rx="12" fill="url(#stepBg)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="36" cy="36" r="16" fill="#005b99"/>
      <text x="31" y="42" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">2</text>
      <text x="64" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="750">Linked Devices</text>

      <rect x="25" y="70" width="155" height="50" rx="8" fill="#022c22" stroke="#128C7E"/>
      <text x="38" y="100" fill="#25D366" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Linked devices ➔</text>

      <text x="25" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Tap "Linked devices"</text>
      <text x="25" y="168" fill="#22c55e" font-family="system-ui, sans-serif" font-size="12" font-weight="700">from dropdown</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M463 95 L477 95 M471 89 L477 95 L471 101" stroke="#38bdf8" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- STEP 3 -->
    <g transform="translate(490, 0)">
      <rect width="205" height="190" rx="12" fill="url(#stepBg)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
      <circle cx="36" cy="36" r="16" fill="#005b99"/>
      <text x="31" y="42" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">3</text>
      <text x="64" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="750">Audit Devices</text>

      <rect x="25" y="70" width="155" height="50" rx="8" fill="#0f172a" stroke="#f59e0b"/>
      <text x="35" y="93" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Chrome (Windows)</text>
      <text x="35" y="108" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="10">Active now • Unknown</text>

      <text x="25" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Spot any suspicious</text>
      <text x="25" y="168" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">device and tap it</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M708 95 L722 95 M716 89 L722 95 L716 101" stroke="#ef4444" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- STEP 4 -->
    <g transform="translate(735, 0)">
      <rect width="185" height="190" rx="12" fill="url(#stepBg)" stroke="#ef4444" stroke-width="2" filter="url(#cardShadow)"/>
      <circle cx="36" cy="36" r="16" fill="#ef4444"/>
      <text x="31" y="42" fill="#fff" font-family="system-ui, sans-serif" font-size="16" font-weight="800">4</text>
      <text x="64" y="42" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="16" font-weight="750">Log Out</text>

      <rect x="25" y="75" width="135" height="40" rx="8" fill="#ef4444"/>
      <text x="60" y="100" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="800">LOG OUT</text>

      <text x="25" y="150" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Tap red button</text>
      <text x="25" y="168" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Session terminated!</text>
    </g>

  </g>
</svg>
