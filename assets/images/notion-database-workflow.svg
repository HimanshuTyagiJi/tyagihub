<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="dbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="#0b0f19" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Diagram Title -->
  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">
    Solopreneur Notion Relational Architecture (The 3-Database Core)
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    How Client Accounts, Project Deliverables, and Daily Tasks connect automatically without manual duplication
  </text>

  <!-- Box 1: Clients Database (Master CRM) -->
  <g transform="translate(40, 110)" filter="url(#boxShadow)">
    <rect width="240" height="310" rx="10" fill="url(#dbGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="240" height="40" rx="10" fill="#0284c7" opacity="0.25"/>
    <rect y="25" width="240" height="15" fill="#0284c7" opacity="0.25"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="750">👥 1. Clients Database</text>

    <!-- Properties -->
    <g transform="translate(18, 55)">
      <text x="0" y="15" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">CORE PROPERTIES:</text>
      
      <circle cx="5" cy="38" r="3.5" fill="#38bdf8"/>
      <text x="16" y="42" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Client Name (Title)</text>

      <circle cx="5" cy="68" r="3.5" fill="#38bdf8"/>
      <text x="16" y="72" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Status (Select)</text>
      <text x="16" y="88" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Active • Onboarding • Past</text>

      <circle cx="5" cy="114" r="3.5" fill="#38bdf8"/>
      <text x="16" y="118" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Rate / Monthly Value (Number)</text>

      <circle cx="5" cy="144" r="3.5" fill="#38bdf8"/>
      <text x="16" y="148" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Contact Email (Email)</text>

      <!-- Relation Link -->
      <rect x="0" y="172" width="204" height="60" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="10" y="194" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">🔗 Relation to Projects:</text>
      <text x="10" y="214" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">One client can have multiple active projects.</text>
    </g>
  </g>

  <!-- Connecting Arrow 1 -> 2 -->
  <g transform="translate(290, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#flowGrad)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#818cf8"/>
  </g>

  <!-- Box 2: Projects Database (Deliverables Hub) -->
  <g transform="translate(330, 110)" filter="url(#boxShadow)">
    <rect width="240" height="310" rx="10" fill="url(#dbGrad1)" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="240" height="40" rx="10" fill="#6366f1" opacity="0.25"/>
    <rect y="25" width="240" height="15" fill="#6366f1" opacity="0.25"/>
    <text x="18" y="26" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="750">📁 2. Projects Database</text>

    <!-- Properties -->
    <g transform="translate(18, 55)">
      <text x="0" y="15" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">CORE PROPERTIES:</text>
      
      <circle cx="5" cy="38" r="3.5" fill="#818cf8"/>
      <text x="16" y="42" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Project Name (Title)</text>

      <circle cx="5" cy="68" r="3.5" fill="#818cf8"/>
      <text x="16" y="72" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Client (Relation ← DB 1)</text>

      <circle cx="5" cy="98" r="3.5" fill="#818cf8"/>
      <text x="16" y="102" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Deadline (Date Range)</text>

      <circle cx="5" cy="128" r="3.5" fill="#818cf8"/>
      <text x="16" y="132" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Project Status (Status)</text>
      <text x="16" y="148" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Planning • In Flight • Review • Done</text>

      <!-- Relation Link -->
      <rect x="0" y="172" width="204" height="60" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="10" y="194" fill="#818cf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">🔗 Relation to Daily Tasks:</text>
      <text x="10" y="214" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Each task belongs to an overarching project.</text>
    </g>
  </g>

  <!-- Connecting Arrow 2 -> 3 -->
  <g transform="translate(580, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#flowGrad)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#10b981"/>
  </g>

  <!-- Box 3: Daily Tasks Database (Kanban Execution) -->
  <g transform="translate(620, 110)" filter="url(#boxShadow)">
    <rect width="240" height="310" rx="10" fill="url(#dbGrad1)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="240" height="40" rx="10" fill="#10b981" opacity="0.25"/>
    <rect y="25" width="240" height="15" fill="#10b981" opacity="0.25"/>
    <text x="18" y="26" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="750">✅ 3. Daily Tasks Database</text>

    <!-- Properties -->
    <g transform="translate(18, 55)">
      <text x="0" y="15" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">CORE PROPERTIES:</text>
      
      <circle cx="5" cy="38" r="3.5" fill="#10b981"/>
      <text x="16" y="42" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Action Item (Title)</text>

      <circle cx="5" cy="68" r="3.5" fill="#10b981"/>
      <text x="16" y="72" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Due Date (Date - Filter "Today")</text>

      <circle cx="5" cy="98" r="3.5" fill="#10b981"/>
      <text x="16" y="102" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Priority (P1 Urgent • P2 • P3)</text>

      <circle cx="5" cy="128" r="3.5" fill="#10b981"/>
      <text x="16" y="132" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600">Project (Relation ← DB 2)</text>

      <!-- Rollup Property -->
      <rect x="0" y="172" width="204" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="10" y="194" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">🔄 Auto-Rollup Client Name:</text>
      <text x="10" y="214" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Pulls client name straight from Project DB!</text>
    </g>
  </g>

  <!-- Bottom Tip Banner -->
  <rect x="40" y="435" width="820" height="30" rx="6" fill="#1e293b" opacity="0.6"/>
  <text x="450" y="455" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="500">
    ⚡ Result: Your main dashboard only displays tasks due "Today", keeping your headspace 100% focused while background databases stay organized.
  </text>
</svg>
