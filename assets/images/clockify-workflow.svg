<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="clkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082f49"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#031826"/>
    </linearGradient>
    <linearGradient id="clkCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="clkFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="clkShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="url(#clkBg)" stroke="#0369a1" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">
    Freelancer Billable Time &amp; Audit Pipeline Architecture
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    How granular task tracking and automated rounding eliminate client payment disputes forever
  </text>

  <!-- Step 1: Real-Time Timer & Metadata -->
  <g transform="translate(35, 110)" filter="url(#clkShadow)">
    <rect width="250" height="310" rx="10" fill="url(#clkCard)" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#0284c7" opacity="0.25"/>
    <rect y="25" width="250" height="15" fill="#0284c7" opacity="0.25"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">⏱️ 1. Task Logging &amp; Tagging</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">ACTIVE WORK TRACKING:</text>

      <rect y="25" width="218" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="44" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">01:45:22 [▶ RUNNING]</text>
      <text x="10" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Task: "API Endpoint Debugging"</text>
      <text x="10" y="74" fill="#60a5fa" font-family="system-ui, -apple-system, sans-serif" font-size="9">Project: Acme Corp SaaS Redesign</text>

      <text x="0" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Essential Metadata Tags:</text>
      <rect y="115" width="218" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="134" fill="#22c55e" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700">✓ $ Billable: TRUE (Toggle On)</text>
      <text x="10" y="152" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Hourly Rate: ₹1,500 / hr ($25/hr)</text>

      <text x="0" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Runs on mobile app, desktop, or browser.</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(295, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#clkFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#38bdf8"/>
  </g>

  <!-- Step 2: Auto-Rounding & Calculation Engine -->
  <g transform="translate(335, 110)" filter="url(#clkShadow)">
    <rect width="250" height="310" rx="10" fill="url(#clkCard)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#0284c7" opacity="0.2"/>
    <rect y="25" width="250" height="15" fill="#0284c7" opacity="0.2"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">⚡ 2. Automated Rounding Engine</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">ROUNDING RULES (15-MIN BLOCKS):</text>

      <rect y="25" width="218" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="44" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Actual Duration: 1h 45m 22s</text>
      <text x="10" y="60" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="700">→ Rounded: 2.00 Hours</text>
      <text x="10" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Protects micro-task switching context</text>

      <text x="0" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Calculated Revenue:</text>
      <rect y="115" width="218" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="134" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700">2.00 hrs × ₹1,500 = ₹3,000</text>
      <text x="10" y="152" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Auto-categorized by milestone</text>

      <text x="0" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Zero mental math or manual spreadsheet errors.</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(595, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#clkFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#10b981"/>
  </g>

  <!-- Step 3: 1-Click Client Audit PDF -->
  <g transform="translate(635, 110)" filter="url(#clkShadow)">
    <rect width="230" height="310" rx="10" fill="url(#clkCard)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="230" height="40" rx="10" fill="#059669" opacity="0.2"/>
    <rect y="25" width="230" height="15" fill="#059669" opacity="0.2"/>
    <text x="18" y="26" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">📄 3. Client Timesheet Audit</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">PDF TIMESHEET ATTACHMENT:</text>

      <rect y="25" width="198" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="44" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">Itemized Work Breakdown</text>
      <text x="10" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Exact timestamps &amp; notes</text>
      <text x="10" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Transparent proof of work</text>

      <text x="0" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Client Approval Result:</text>
      <rect y="115" width="198" height="52" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="135" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">✓ Instant Invoice Clearance</text>
      <text x="10" y="153" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="9">Clients pay without questioning hours.</text>

      <text x="0" y="190" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Professional, accountable, frictionless.</text>
    </g>
  </g>
</svg>