<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="invBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062817"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glowInv" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#invBg)"/>

  <!-- Subtle Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Glowing Elements -->
  <circle cx="200" cy="180" r="180" fill="#10b981" opacity="0.12" filter="url(#glowInv)"/>
  <circle cx="1020" cy="420" r="220" fill="#0284c7" opacity="0.12" filter="url(#glowInv)"/>

  <!-- Badge -->
  <rect x="80" y="80" width="230" height="42" rx="21" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1.5"/>
  <circle cx="105" cy="101" r="6" fill="#10b981"/>
  <text x="125" y="107" fill="#10b981" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1">BUSINESS APPS</text>

  <!-- Title -->
  <text x="80" y="180" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="48" font-weight="850" letter-spacing="-1">
    Zoho Invoice GST Setup
  </text>
  <text x="80" y="240" fill="url(#greenGrad)" font-family="system-ui, sans-serif" font-size="44" font-weight="800">
    100% Free Professional Billing
  </text>

  <!-- Subtitle -->
  <text x="80" y="300" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22" font-weight="500">
    GST-compliant invoices, UPI payment links &amp; client portals without subscriptions
  </text>

  <!-- 3 Feature Chips -->
  <g transform="translate(80, 360)">
    <rect x="0" y="0" width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="18" y="25" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="600">🧾 100% Free Forever</text>

    <rect x="195" y="0" width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="213" y="25" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">⚡ GST Auto-Calculate</text>

    <rect x="390" y="0" width="185" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="408" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">💳 UPI / Card Payments</text>
  </g>

  <!-- Publisher Tag -->
  <text x="80" y="550" fill="#64748b" font-family="system-ui, sans-serif" font-size="18" font-weight="600">
    TyagiHub Research • Verified 2026 Tutorial
  </text>

  <!-- Right Visual: Clean Invoice Mockup -->
  <g transform="translate(750, 100)">
    <!-- Invoice Paper Sheet -->
    <rect x="0" y="0" width="340" height="440" rx="14" fill="#ffffff" filter="url(#glowInv)"/>
    
    <!-- Invoice Header -->
    <rect x="25" y="25" width="80" height="24" rx="4" fill="#005b99"/>
    <text x="35" y="42" fill="#fff" font-family="system-ui, sans-serif" font-size="12" font-weight="800">INVOICE</text>
    <text x="220" y="42" fill="#64748b" font-family="monospace" font-size="12">#INV-2026-001</text>
    
    <!-- Divider -->
    <line x1="25" y1="65" x2="315" y2="65" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Bill To details -->
    <text x="25" y="90" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10" font-weight="700">BILLED TO:</text>
    <text x="25" y="108" fill="#0f172a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Acme Technologies Pvt Ltd</text>
    <text x="25" y="125" fill="#64748b" font-family="monospace" font-size="10">GSTIN: 07AAAAA0000A1Z5</text>

    <!-- Table Header -->
    <rect x="25" y="150" width="290" height="28" rx="4" fill="#f8fafc"/>
    <text x="35" y="168" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="700">DESCRIPTION</text>
    <text x="250" y="168" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="700">AMOUNT</text>

    <!-- Line items -->
    <text x="35" y="200" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">Web Development</text>
    <text x="250" y="200" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">₹25,000</text>
    <line x1="25" y1="215" x2="315" y2="215" stroke="#f1f5f9" stroke-width="1"/>

    <text x="35" y="235" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">Cloud Setup &amp; DNS</text>
    <text x="250" y="235" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12">₹5,000</text>
    <line x1="25" y1="250" x2="315" y2="250" stroke="#f1f5f9" stroke-width="1"/>

    <!-- GST Tax breakdown -->
    <text x="170" y="280" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">Subtotal:</text>
    <text x="250" y="280" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11">₹30,000</text>
    <text x="170" y="302" fill="#64748b" font-family="system-ui, sans-serif" font-size="11">IGST (18%):</text>
    <text x="250" y="302" fill="#0f172a" font-family="system-ui, sans-serif" font-size="11">₹5,400</text>

    <!-- Total Highlight Card -->
    <rect x="150" y="325" width="165" height="42" rx="6" fill="#064e3b"/>
    <text x="165" y="352" fill="#34d399" font-family="system-ui, sans-serif" font-size="15" font-weight="800">TOTAL: ₹35,400</text>

    <!-- Paid Stamp Badge -->
    <g transform="translate(45, 305) rotate(-15)">
      <rect x="0" y="0" width="95" height="36" rx="4" fill="none" stroke="#10b981" stroke-width="3"/>
      <text x="18" y="24" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="2">PAID</text>
    </g>
  </g>
</svg>
