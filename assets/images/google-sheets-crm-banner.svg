<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="crmBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="crmCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accentGreen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#crmBg)"/>

  <!-- Subtle Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="250" y1="0" x2="250" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="550" y1="0" x2="550" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="850" y1="0" x2="850" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1150" y1="0" x2="1150" y2="630"/>
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
  </g>

  <!-- Category Badge -->
  <g transform="translate(80, 80)">
    <rect width="260" height="40" rx="8" fill="#10b981" opacity="0.2"/>
    <rect width="260" height="40" rx="8" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <text x="24" y="26" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5">
      PRODUCTIVITY &amp; SYSTEMS
    </text>
  </g>

  <!-- Main Headline -->
  <text x="80" y="195" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="900" letter-spacing="-1">
    Google Sheets Free CRM Blueprint
  </text>
  <text x="80" y="250" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500">
    Automate Leads, Deal Stages &amp; Follow-Ups for ₹0 / Month
  </text>

  <!-- Visual Mockup Container (CRM Table Preview) -->
  <g transform="translate(80, 310)" filter="url(#cardShadow)">
    <rect width="1040" height="250" rx="14" fill="url(#crmCard)" stroke="#334155" stroke-width="1.5"/>

    <!-- Table Header Row -->
    <rect width="1040" height="48" rx="14" fill="#064e3b" opacity="0.5"/>
    <rect y="30" width="1040" height="18" fill="#064e3b" opacity="0.5"/>
    <text x="30" y="30" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">CLIENT / COMPANY</text>
    <text x="260" y="30" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">DEAL VALUE</text>
    <text x="440" y="30" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">PIPELINE STAGE</text>
    <text x="660" y="30" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">NEXT FOLLOW-UP</text>
    <text x="880" y="30" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">STATUS ALERT</text>

    <!-- Row 1 -->
    <line x1="0" y1="48" x2="1040" y2="48" stroke="#334155" stroke-width="1"/>
    <text x="30" y="85" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Apex Media Labs</text>
    <text x="260" y="85" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">₹85,000</text>
    <g transform="translate(440, 68)">
      <rect width="140" height="26" rx="6" fill="#0284c7" opacity="0.25"/>
      <text x="14" y="18" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Proposal Sent</text>
    </g>
    <text x="660" y="85" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Tomorrow, 11 AM</text>
    <g transform="translate(880, 68)">
      <rect width="90" height="26" rx="6" fill="#10b981" opacity="0.2"/>
      <text x="14" y="18" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">● Active</text>
    </g>

    <!-- Row 2 -->
    <line x1="0" y1="114" x2="1040" y2="114" stroke="#1e293b" stroke-width="1"/>
    <text x="30" y="150" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">Zenith FinTech</text>
    <text x="260" y="150" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">₹1,40,000</text>
    <g transform="translate(440, 133)">
      <rect width="140" height="26" rx="6" fill="#059669" opacity="0.25"/>
      <text x="18" y="18" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Negotiation</text>
    </g>
    <text x="660" y="150" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600">Today (Urgent)</text>
    <g transform="translate(880, 133)">
      <rect width="90" height="26" rx="6" fill="#f59e0b" opacity="0.2"/>
      <text x="14" y="18" fill="#fbbf24" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">⚡ Due Now</text>
    </g>

    <!-- Row 3 -->
    <line x1="0" y1="180" x2="1040" y2="180" stroke="#1e293b" stroke-width="1"/>
    <text x="30" y="215" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">CloudMatrix Corp</text>
    <text x="260" y="215" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">₹60,000</text>
    <g transform="translate(440, 198)">
      <rect width="140" height="26" rx="6" fill="#10b981" opacity="0.35"/>
      <text x="16" y="18" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">Closed Won 🏆</text>
    </g>
    <text x="660" y="215" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="14">Contract Signed</text>
    <g transform="translate(880, 198)">
      <rect width="90" height="26" rx="6" fill="#10b981" opacity="0.2"/>
      <text x="14" y="18" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">✓ Won</text>
    </g>
  </g>
</svg>
