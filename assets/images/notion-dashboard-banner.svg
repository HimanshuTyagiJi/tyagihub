    <g transform="translate(136, 56)">
      <text x="0" y="20" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="750">🎯 Today's Priority Focus</text>

      <!-- Kanban Columns -->
      <!-- Column 1: In Progress -->
      <g transform="translate(0, 36)">
        <rect width="140" height="160" rx="8" fill="#1e293b" opacity="0.5" stroke="#334155" stroke-width="1"/>
        <rect x="8" y="8" width="65" height="18" rx="4" fill="#f59e0b" opacity="0.2"/>
        <text x="14" y="21" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">IN PROGRESS</text>

        <!-- Card 1 -->
        <rect x="8" y="34" width="124" height="52" rx="6" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
        <text x="16" y="52" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="650">Website Redesign</text>
        <text x="16" y="70" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Acme Corp • High</text>

        <!-- Card 2 -->
        <rect x="8" y="94" width="124" height="52" rx="6" fill="#0f172a" stroke="#475569" stroke-width="0.8"/>
        <text x="16" y="112" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="650">GST Invoice Q3</text>
        <text x="16" y="130" fill="#a78bfa" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Finance • Due Today</text>
      </g>

      <!-- Column 2: Completed -->
      <g transform="translate(152, 36)">
        <rect width="140" height="160" rx="8" fill="#1e293b" opacity="0.5" stroke="#334155" stroke-width="1"/>
        <rect x="8" y="8" width="60" height="18" rx="4" fill="#10b981" opacity="0.2"/>
        <text x="14" y="21" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">COMPLETED</text>

        <!-- Card 1 -->
        <rect x="8" y="34" width="124" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="52" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-decoration="line-through">Zoho DNS Config</text>
        <text x="16" y="70" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Verified • Live</text>

        <!-- Card 2 -->
        <rect x="8" y="94" width="124" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="16" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" text-decoration="line-through">Send Contract NDA</text>
        <text x="16" y="130" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600">Signed • Done</text>
      </g>

      <!-- Lower Widget: Quick Notes &amp; Stats -->
      <g transform="translate(0, 212)">
        <rect width="292" height="175" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="14" y="24" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">⚡ Weekly Solopreneur Stats</text>
        
        <rect x="14" y="38" width="80" height="48" rx="6" fill="#0f172a"/>
        <text x="24" y="58" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">12</text>
        <text x="24" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">Tasks Done</text>

        <rect x="106" y="38" width="80" height="48" rx="6" fill="#0f172a"/>
        <text x="116" y="58" fill="#10b981" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">4</text>
        <text x="116" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">Active Clients</text>

        <rect x="198" y="38" width="80" height="48" rx="6" fill="#0f172a"/>
        <text x="208" y="58" fill="#f59e0b" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">100%</text>
        <text x="208" y="74" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="9">Free Tier</text>

        <text x="14" y="112" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Quick Scratchpad:</text>
        <rect x="14" y="122" width="264" height="40" rx="4" fill="#0f172a" stroke="#334155" stroke-width="0.8"/>
        <text x="22" y="146" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10">Follow up with Dev on API documentation tomorrow at 11 AM...</text>
      </g>
    </g>
  </g>
</svg>
