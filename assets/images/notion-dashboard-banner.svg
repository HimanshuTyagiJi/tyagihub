<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Left Content Area -->
  <g transform="translate(80, 100)">
    <!-- Pill Badge -->
    <rect width="250" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="22" cy="19" r="6" fill="#38bdf8"/>
    <text x="38" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="0.5">PRODUCTIVITY WORKFLOW</text>

    <!-- Main Title -->
    <text x="0" y="95" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="850" letter-spacing="-1">
      Notion for Solopreneurs:
    </text>
    <text x="0" y="145" fill="url(#accentGrad)" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800">
      Build a Complete Daily Dashboard
    </text>

    <!-- Subtitle -->
    <text x="0" y="200" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500">
      Task Kanbans, Client Databases &amp; Notes Hub
    </text>
    <text x="0" y="232" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="400">
      100% Free Plan • Zero Paid Templates Needed • Step-by-Step
    </text>

    <!-- Feature Checklist -->
    <g transform="translate(0, 280)">
      <circle cx="12" cy="12" r="10" fill="#0284c7" opacity="0.2"/>
      <path d="M7 12l3 3 7-7" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <text x="32" y="18" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Unified Solopreneur Command Center</text>

      <circle cx="12" cy="52" r="10" fill="#0284c7" opacity="0.2"/>
      <path d="M7 52l3 3 7-7" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <text x="32" y="58" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Client CRM &amp; Active Deliverable Tracker</text>

      <circle cx="12" cy="92" r="10" fill="#0284c7" opacity="0.2"/>
      <path d="M7 92l3 3 7-7" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" fill="none"/>
      <text x="32" y="98" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600">Daily To-Do Kanban with Auto-Filters</text>
    </g>
  </g>

  <!-- Right Mockup: Notion Workspace Window -->
  <g transform="translate(680, 80)" filter="url(#shadow)">
    <!-- Window Frame -->
    <rect width="450" height="470" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>

    <!-- Window Header -->
    <rect width="450" height="42" rx="16" fill="#1e293b"/>
    <rect y="26" width="450" height="16" fill="#1e293b"/>
    <circle cx="22" cy="21" r="5.5" fill="#ef4444"/>
    <circle cx="40" cy="21" r="5.5" fill="#f59e0b"/>
    <circle cx="58" cy="21" r="5.5" fill="#10b981"/>
    <text x="90" y="26" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⚡ Solopreneur Command Center</text>

    <!-- Notion Sidebar Mock -->
    <rect x="0" y="42" width="120" height="428" fill="#0f172a" opacity="0.6"/>
    <text x="14" y="70" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">WORKSPACE</text>
    <rect x="10" y="82" width="100" height="24" rx="4" fill="#1e293b"/>
    <text x="18" y="98" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">📌 Today Hub</text>
    <text x="18" y="126" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">👥 Client CRM</text>
    <text x="18" y="152" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">📋 Tasks Board</text>
    <text x="18" y="178" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">💡 Ideas Vault</text>
    <text x="18" y="204" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="11">💰 Invoice Logs</text>

