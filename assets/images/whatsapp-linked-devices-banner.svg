<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366"/>
      <stop offset="100%" stop-color="#128C7E"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
  </g>

  <!-- Decorative Glowing Orbs -->
  <circle cx="200" cy="150" r="180" fill="#25D366" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="220" fill="#0284c7" opacity="0.15" filter="url(#glow)"/>

  <!-- Left: Security Brand Badge -->
  <rect x="80" y="80" width="220" height="42" rx="21" fill="rgba(37, 211, 102, 0.15)" stroke="#25D366" stroke-width="1.5"/>
  <circle cx="105" cy="101" r="6" fill="#25D366"/>
  <text x="125" y="107" fill="#25D366" font-family="system-ui, sans-serif" font-size="16" font-weight="700" letter-spacing="1">MOBILE PRIVACY</text>

  <!-- Main Headline Text -->
  <text x="80" y="180" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="48" font-weight="850" letter-spacing="-1">
    WhatsApp Linked Devices
  </text>
  <text x="80" y="240" fill="url(#primaryGrad)" font-family="system-ui, sans-serif" font-size="44" font-weight="800">
    Security &amp; Detection Guide
  </text>

  <!-- Subtitle Description -->
  <text x="80" y="300" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="22" font-weight="500">
    Detect unauthorized PC &amp; phone mirroring • Terminate remote sessions
  </text>

  <!-- 3 Feature Chips -->
  <g transform="translate(80, 360)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="165" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="18" y="25" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="15" font-weight="600">🛡️ Multi-Device</text>

    <!-- Chip 2 -->
    <rect x="180" y="0" width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="198" y="25" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">⚡ Instant Logout</text>

    <!-- Chip 3 -->
    <rect x="375" y="0" width="180" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="393" y="25" fill="#22c55e" font-family="system-ui, sans-serif" font-size="15" font-weight="600">🔒 5-Layer Shield</text>
  </g>

  <!-- Publisher Tag -->
  <text x="80" y="550" fill="#64748b" font-family="system-ui, sans-serif" font-size="18" font-weight="600">
    TyagiHub Research • Verified 2026 Tutorial
  </text>

  <!-- Right Side Visual Illustration -->
  <g transform="translate(760, 110)">
    <!-- Main Smartphone Mockup -->
    <rect x="60" y="40" width="220" height="420" rx="36" fill="#0f172a" stroke="#334155" stroke-width="3" filter="url(#glow)"/>
    <rect x="75" y="60" width="190" height="380" rx="24" fill="#022c22"/>
    
    <!-- Phone Screen UI -->
    <!-- Header bar -->
    <rect x="75" y="60" width="190" height="48" rx="10" fill="#128C7E"/>
    <circle cx="100" cy="84" r="10" fill="#ffffff" opacity="0.3"/>
    <rect x="120" y="80" width="70" height="8" rx="4" fill="#ffffff"/>
    
    <!-- WhatsApp QR / Device Linked Card on Screen -->
    <rect x="90" y="130" width="160" height="130" rx="12" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="170" cy="175" r="24" fill="#10b981" opacity="0.2"/>
    <!-- Shield check icon -->
    <path d="M170 162 L185 168 V182 C185 192 170 198 170 198 C170 198 155 192 155 182 V168 Z" fill="#25D366"/>
    <path d="M165 180 L168 183 L176 174" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="110" y="235" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700">LINKED DEVICES</text>

    <!-- Connected Laptop Card (Offset to left) -->
    <g transform="translate(-140, 180)">
      <rect x="0" y="0" width="180" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
      <rect x="12" y="12" width="156" height="58" rx="6" fill="#0f172a"/>
      <!-- Browser Mock -->
      <circle cx="24" cy="24" r="3" fill="#ef4444"/>
      <circle cx="34" cy="24" r="3" fill="#f59e0b"/>
      <circle cx="44" cy="24" r="3" fill="#10b981"/>
      <rect x="56" y="20" width="90" height="8" rx="3" fill="#334155"/>
      <text x="16" y="94" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Chrome (Windows)</text>
      <circle cx="160" cy="90" r="5" fill="#ef4444"/>
    </g>

    <!-- Red Alert Warning Badge -->
    <g transform="translate(140, 310)">
      <circle cx="40" cy="40" r="36" fill="#ef4444" filter="url(#glow)"/>
      <text x="31" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="900">!</text>
    </g>
  </g>
</svg>
