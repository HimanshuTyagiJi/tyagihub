<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="cfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b18"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="cfCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cfFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="cfShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="url(#cfBg)" stroke="#431407" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">
    Cloudflare Turnstile Zero-Puzzle Verification Architecture
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    How Turnstile stops 99.9% spam bots in under 50ms without annoying users with puzzle captchas
  </text>

  <!-- Step 1: Client Browser -->
  <g transform="translate(35, 110)" filter="url(#cfShadow)">
    <rect width="250" height="310" rx="10" fill="url(#cfCard)" stroke="#f97316" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#f97316" opacity="0.2"/>
    <rect y="25" width="250" height="15" fill="#f97316" opacity="0.2"/>
    <text x="18" y="26" fill="#fb923c" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">🌐 1. Client Browser (Frontend)</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">USER VISITS WEBSITE FORM:</text>

      <rect y="25" width="218" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="44" fill="#fdba74" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Invisible JavaScript Evaluation</text>
      <text x="10" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Analyzes browser telemetry &amp; Proof-of-Work</text>
      <text x="10" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Zero bicycles, crosswalks, or image clicks!</text>

      <text x="0" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Generated Form Payload:</text>
      <rect y="115" width="218" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="134" fill="#38bdf8" font-family="monospace" font-size="9">cf-turnstile-response =</text>
      <text x="10" y="152" fill="#38bdf8" font-family="monospace" font-size="9">"0.a8c1f930e84b..." (Single Token)</text>

      <text x="0" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Submits token seamlessly with POST data.</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(295, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#cfFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#f97316"/>
  </g>

  <!-- Step 2: Backend Web Server -->
  <g transform="translate(335, 110)" filter="url(#cfShadow)">
    <rect width="250" height="310" rx="10" fill="url(#cfCard)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#0284c7" opacity="0.2"/>
    <rect y="25" width="250" height="15" fill="#0284c7" opacity="0.2"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">⚙️ 2. Your Application Backend</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">INSPECT INCOMING REQUEST:</text>

      <rect y="25" width="218" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="44" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Extracts Token from POST body</text>
      <text x="10" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Node.js, Python, PHP, or Go backend</text>
      <text x="10" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Never trusts client input blindly</text>

      <text x="0" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Server-Side Siteverify Call:</text>
      <rect y="115" width="218" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="134" fill="#a78bfa" font-family="monospace" font-size="8.5">POST /turnstile/v0/siteverify</text>
      <text x="10" y="152" fill="#94a3b8" font-family="monospace" font-size="8.5">secret = "0x4AAAAAA..." + token</text>

      <text x="0" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Sends internal HTTPS request to Cloudflare.</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(595, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#cfFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#10b981"/>
  </g>

  <!-- Step 3: Cloudflare Edge Validation -->
  <g transform="translate(635, 110)" filter="url(#cfShadow)">
    <rect width="230" height="310" rx="10" fill="url(#cfCard)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="230" height="40" rx="10" fill="#059669" opacity="0.2"/>
    <rect y="25" width="230" height="15" fill="#059669" opacity="0.2"/>
    <text x="18" y="26" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">🛡️ 3. Cloudflare Edge Server</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">CRYPTOGRAPHIC VALIDATION:</text>

      <rect y="25" width="198" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="44" fill="#34d399" font-family="monospace" font-size="10" font-weight="700">{ "success": true }</text>
      <text x="10" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Token validity confirmed</text>
      <text x="10" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Solved in &lt; 50ms latency</text>

      <text x="0" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Decision Outcome:</text>
      <rect y="115" width="198" height="52" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="135" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">✓ Legitimate Human Verified</text>
      <text x="10" y="153" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="9">Backend saves form data / sends email.</text>

      <text x="0" y="190" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Zero spam, zero user friction.</text>
    </g>
  </g>
</svg>