<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" viewBox="0 0 900 480" width="900" height="480">
  <defs>
    <linearGradient id="tgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#06121e"/>
    </linearGradient>
    <linearGradient id="tgCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tgFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#229ED9"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="tgShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="url(#tgBg)" stroke="#0284c7" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="44" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800" letter-spacing="-0.5">
    Telegram Personal Bot Automation Architecture
  </text>
  <text x="450" y="70" text-anchor="middle" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13">
    How BotFather, Telegram Cloud API, and lightweight Python webhooks create a private phone assistant
  </text>

  <!-- Step 1: User & Telegram App -->
  <g transform="translate(35, 110)" filter="url(#tgShadow)">
    <rect width="250" height="310" rx="10" fill="url(#tgCard)" stroke="#229ED9" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#229ED9" opacity="0.25"/>
    <rect y="25" width="250" height="15" fill="#229ED9" opacity="0.25"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">📱 1. Mobile Phone Command</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">USER CHATS WITH PRIVATE BOT:</text>

      <rect y="25" width="218" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="44" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700">/remind 3pm Client Call</text>
      <text x="10" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Sends text, PDF document, or photo</text>
      <text x="10" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Encrypted via Telegram MTProto</text>

      <text x="0" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Bot Identity &amp; Auth:</text>
      <rect y="115" width="218" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="134" fill="#6ee7b7" font-family="monospace" font-size="9">@MyPersonalAlertBot</text>
      <text x="10" y="152" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Locked strictly to your private Chat ID</text>

      <text x="0" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Zero stranger access. 100% private.</text>
    </g>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(295, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#tgFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#229ED9"/>
  </g>

  <!-- Step 2: Telegram Cloud Bot API -->
  <g transform="translate(335, 110)" filter="url(#tgShadow)">
    <rect width="250" height="310" rx="10" fill="url(#tgCard)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="250" height="40" rx="10" fill="#0284c7" opacity="0.2"/>
    <rect y="25" width="250" height="15" fill="#0284c7" opacity="0.2"/>
    <text x="18" y="26" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">☁️ 2. Telegram Bot API Hub</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">GLOBAL CLOUD DISPATCH:</text>

      <rect y="25" width="218" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="44" fill="#a78bfa" font-family="monospace" font-size="9.5">POST /bot{token}/setWebhook</text>
      <text x="10" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">Dispatches JSON updates in &lt; 30ms</text>
      <text x="10" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">No constant polling required!</text>

      <text x="0" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">JSON Update Event:</text>
      <rect y="115" width="218" height="52" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="10" y="134" fill="#38bdf8" font-family="monospace" font-size="9">{ "message": { "text": "..." } }</text>
      <text x="10" y="152" fill="#fbbf24" font-family="monospace" font-size="9">chat: { id: 894102941 }</text>

      <text x="0" y="190" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="10">Delivers instantly to your listener.</text>
    </g>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(595, 240)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="url(#tgFlow)" stroke-width="3" stroke-linecap="round"/>
    <polygon points="30,-5 40,0 30,5" fill="#10b981"/>
  </g>

  <!-- Step 3: Python Automation Engine -->
  <g transform="translate(635, 110)" filter="url(#tgShadow)">
    <rect width="230" height="310" rx="10" fill="url(#tgCard)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="230" height="40" rx="10" fill="#059669" opacity="0.2"/>
    <rect y="25" width="230" height="15" fill="#059669" opacity="0.2"/>
    <text x="18" y="26" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="750">⚙️ 3. Python Automation Logic</text>

    <g transform="translate(16, 55)">
      <text x="0" y="15" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">TASKS EXECUTED:</text>

      <rect y="25" width="198" height="60" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="44" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700">✓ Free Cloud Storage</text>
      <text x="10" y="60" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Stores files up to 2GB free</text>
      <text x="10" y="74" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="9">• Scheduled reminders &amp; cron</text>

      <text x="0" y="105" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Instant Return Message:</text>
      <rect y="115" width="198" height="52" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="10" y="135" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700">"✓ Alert scheduled for 3:00 PM"</text>
      <text x="10" y="153" fill="#a7f3d0" font-family="system-ui, -apple-system, sans-serif" font-size="9">Buzzes your phone on time.</text>

      <text x="0" y="190" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="600">Zero subscription fees forever.</text>
    </g>
  </g>
</svg>