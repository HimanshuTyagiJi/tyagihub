<svg preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="gcpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="45%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="termCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="gcpShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#gcpBg)"/>

  <!-- Matrix / Grid Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="220" y1="0" x2="220" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="780" y1="0" x2="780" y2="630"/>
    <line x1="920" y1="0" x2="920" y2="630"/>
    <line x1="1060" y1="0" x2="1060" y2="630"/>
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
  </g>

  <!-- Category Badge -->
  <g transform="translate(80, 75)">
    <rect width="250" height="38" rx="8" fill="#38bdf8" opacity="0.18"/>
    <rect width="250" height="38" rx="8" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="24" y="24" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" letter-spacing="1.5">
      CLOUD &amp; DIGITAL TOOLS
    </text>
  </g>

  <!-- Headline -->
  <text x="80" y="185" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="900" letter-spacing="-1">
    Google Cloud Always Free Server
  </text>
  <text x="80" y="240" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="23" font-weight="500">
    Run a 24/7 Cloud VM for Automations, Bots &amp; Webhooks at ₹0 Forever
  </text>

  <!-- Terminal Window Mockup -->
  <g transform="translate(80, 295)" filter="url(#gcpShadow)">
    <rect width="1040" height="270" rx="12" fill="url(#termCard)" stroke="#334155" stroke-width="1.5"/>

    <!-- Terminal Titlebar -->
    <rect width="1040" height="42" rx="12" fill="#0f172a"/>
    <rect y="24" width="1040" height="18" fill="#0f172a"/>
    <line x1="0" y1="42" x2="1040" y2="42" stroke="#1e293b" stroke-width="1"/>

    <!-- Window Controls -->
    <circle cx="28" cy="21" r="6" fill="#ef4444"/>
    <circle cx="48" cy="21" r="6" fill="#eab308"/>
    <circle cx="68" cy="21" r="6" fill="#10b981"/>

    <text x="520" y="26" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="12">
      himanshu@tyagihub-free-vps:~ (us-central1-a &bull; e2-micro Always Free)
    </text>

    <!-- Terminal Code Body -->
    <g transform="translate(30, 75)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
      <text x="0" y="0" fill="#38bdf8">$</text>
      <text x="20" y="0" fill="#f8fafc">curl -s -X GET https://tyagihub.in/api/server-status</text>

      <text x="0" y="32" fill="#10b981">● SYSTEM HEALTH: OPTIMAL (UPTIME: 142 DAYS, 8 HOURS)</text>

      <text x="0" y="62" fill="#94a3b8">Instance Tier : e2-micro (1 vCPU, 1 GB Memory + 2 GB Swap)</text>
      <text x="0" y="86" fill="#94a3b8">Disk Storage  : 30 GB Standard Persistent Disk (Google Cloud Free Tier)</text>
      <text x="0" y="110" fill="#94a3b8">Active Tasks  : Telegram Cloud Bot [RUNNING], Cron Sync [ACTIVE]</text>
      <text x="0" y="134" fill="#34d399">Total Monthly Cost: ₹0.00 / $0.00 (Permanent Always Free Quota)</text>

      <text x="0" y="165" fill="#38bdf8">$</text>
      <rect x="20" y="152" width="10" height="18" fill="#38bdf8" opacity="0.8"/>
    </g>
  </g>
</svg>
